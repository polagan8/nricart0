<!doctype html>
<html>
  <body
    style="
      background: #f6f3ec;
      font-family: Arial, sans-serif;
      padding: 32px;
      color: #193c32;
    "
  >
    <main
      style="
        max-width: 480px;
        margin: auto;
        background: #fff;
        padding: 32px;
        border-radius: 12px;
      "
    >
      <p style="font-size: 24px; font-weight: bold">NRICart</p>
      <h1 style="font-size: 24px">Reset your NRICart password</h1>
      <p>Use the secure link below to choose a new password.</p>
      <p style="padding: 20px 0">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            background: #193c32;
            color: white;
            padding: 14px 22px;
            border-radius: 6px;
            text-decoration: none;
          "
          >Reset password</a
        >
      </p>
      <p>If you did not request this, you can ignore this email.</p>
    </main>
  </body>
</html>
